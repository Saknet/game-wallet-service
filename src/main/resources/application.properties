spring.application.name=game-wallet-service

# --- 1. Database Configuration (Hibernate 7 / Jakarta EE 11) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:password}}

# In Spring Boot 4 / Hibernate 7, you rarely need to specify the dialect manually 
# as it's auto-detected. If you do, use the new simplified version:
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ddl-auto=update is fine for dev, but standardizing on 'validate' for prod-ready branches is safer
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

# --- 2. High-Performance Concurrency (Java 25) ---
# It enables lightweight threads to handle I/O without blocking.
spring.threads.virtual.enabled=true

# --- 3. JSON Modernization (Jackson 3) ---
spring.jackson.use-jackson2-defaults=false

# --- 4. SSL / HTTPS Configuration ---
server.port=8443
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.enabled=true

# --- 5. Logging & Observability ---
logging.level.org.hibernate.SQL=DEBUG
# Show binding parameters for your wallet transactions
logging.level.org.hibernate.orm.jdbc.bind=TRACE